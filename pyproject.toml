[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qyano"
version = "0.1.0"
description = "Security utilities with a shared CLI and TUI"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.70"]

[project.scripts]
qy = "qyano.cli.main:main"

[tool.setuptools]
py-modules = ["hbe", "eid", "portg", "agent"]

[tool.setuptools.packages.find]
include = ["qyano*"]

[tool.setuptools.package-data]
qyano = ["data/*.csv"]
